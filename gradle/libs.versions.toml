[versions]
# ─── Build Tools ─────────────────────────────────────────────────────────────
# AGP 9+ includes built-in Kotlin support; kotlin.android plugin must NOT be applied.
agp = "9.2.1"
# Kotlin 2.2.10 is cached locally; compose plugin applies separately via kotlin.plugin.compose
kotlin = "2.2.10"
# KSP version must match Kotlin version exactly (format: kotlinVersion-kspPatch)
ksp = "2.2.10-2.0.2"

# ─── Core Android ─────────────────────────────────────────────────────────────
coreKtx = "1.16.0"
appcompat = "1.7.0"
activityCompose = "1.10.1"
lifecycleRuntimeKtx = "2.9.1"

# ─── Jetpack Compose (BOM manages all compose library versions) ───────────────
# 2026.06.01 is the latest BOM as of July 2026
composeBom = "2026.06.01"

# ─── Navigation ───────────────────────────────────────────────────────────────
navigationCompose = "2.9.0"

# ─── Dependency Injection ─────────────────────────────────────────────────────
# Hilt 2.60 is latest as of July 2026; fully compatible with AGP 9 + Kotlin 2.2
hilt = "2.60"
hiltNavigationCompose = "1.2.0"

# ─── Coroutines ──────────────────────────────────────────────────────────────
coroutines = "1.10.2"

# ─── Room ─────────────────────────────────────────────────────────────────────
room = "2.7.1"

# ─── DataStore ────────────────────────────────────────────────────────────────
datastore = "1.1.7"

# ─── Security ─────────────────────────────────────────────────────────────────
securityCrypto = "1.1.0-alpha06"

# ─── Permissions ──────────────────────────────────────────────────────────────


# ─── Testing ──────────────────────────────────────────────────────────────────
junit = "4.13.2"
junitExt = "1.2.1"
espressoCore = "3.6.1"
coroutinesTest = "1.10.2"
turbine = "1.2.0"
mockk = "1.14.2"

[libraries]
# ─── Core ─────────────────────────────────────────────────────────────────────
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }

# ─── Compose BOM + Libraries ──────────────────────────────────────────────────
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation = { group = "androidx.compose.animation", name = "animation" }

# ─── Navigation ───────────────────────────────────────────────────────────────
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ─── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# ─── Coroutines ───────────────────────────────────────────────────────────────
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# ─── Room ─────────────────────────────────────────────────────────────────────
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# ─── DataStore ────────────────────────────────────────────────────────────────
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ─── Security ─────────────────────────────────────────────────────────────────
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# ─── Testing ──────────────────────────────────────────────────────────────────
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9+ has built-in Kotlin; do NOT declare kotlin-android here
# kotlin-android is removed — applying it alongside AGP 9 causes "kotlin extension already registered" error
# The compose compiler plugin is still required separately
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
